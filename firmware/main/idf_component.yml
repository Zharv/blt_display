## IDF Component Manager Manifest File
dependencies:
  idf: ">=5.3"
  lvgl/lvgl: "9.2.*"
  # pin esp_lvgl_port < 2.7: 2.7+ needs LVGL 9.3+, but the BSP demo is on LVGL 9.2
  espressif/esp_lvgl_port: "2.6.0"
  # Wi-Fi via the on-board ESP32-C6 (ESP-Hosted over SDIO)
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/mdns: "^1"
  # BLT tester over USB (Microchip CDC-ACM, VID 04D8 PID 000A); P4 is the USB host
  espressif/usb_host_cdc_acm: "^2"
  # board BSP + LCD/touch drivers live in ../components (auto-discovered).
